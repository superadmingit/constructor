# =====================================================================
#  НОРМЫ ЦЕХА ДЛЯ РАСЧЁТА ШТАМПОВ
#  Единственное место, где хранятся коэффициенты. Код их НЕ дублирует.
#
#  status: draft  -> значения предложены по справочной практике,
#                    конструктор их ещё не утвердил. Пока так, КАЖДЫЙ
#                    результат программы помечается
#                    «ЧЕРНОВИК — НЕ ДЛЯ ИЗГОТОВЛЕНИЯ».
#  status: approved -> конструктор проверил лист согласования
#                    (tools/make_norms_pdf.py печатает его из этого файла).
#
#  Формат каждой нормы:
#    value    — число, которое использует программа
#    unit     — единица
#    typical  — обычный диапазон по справочникам (для конструктора)
#    why      — одной фразой: на что влияет (для конструктора и программиста)
#  Единицы по всей программе: мм, МПа (= Н/мм²), кН. 1 т ≈ 9,81 кН.
# =====================================================================
meta:
  version: "0.1"
  status: draft
  approved_by: null
  approved_date: null

materials:
  soft_steel:
    title: "Мягкая сталь: 08кп, 08пс, 10, Ст2, Ст3"
    sigma_b_mpa:        {value: 480, unit: "МПа", typical: "340–480", why: "Предел прочности σв. Пока нет сертификата на металл, берём верхнюю границу — усилие выйдет с запасом"}
    clearance_pct:      {value: 7.0, unit: "% S на сторону", typical: "5–10", why: "Зазор пуансон–матрица. Меньше — чище срез, но больше износ и усилие; больше — заусенец"}
    min_hole_d_over_s:  {value: 1.0, unit: "× S", typical: "1,0", why: "Отверстие меньше толщины листа — пуансон ломается"}
    min_bend_r_over_s:  {value: 1.0, unit: "× S", typical: "0,5–1,0", why: "Внутренний радиус гиба меньше — риск трещины снаружи гиба"}
  medium_steel:
    title: "Сталь средней прочности: 20, 25, 09Г2С"
    sigma_b_mpa:        {value: 600, unit: "МПа", typical: "450–630", why: "То же, для более прочных сталей"}
    clearance_pct:      {value: 8.0, unit: "% S на сторону", typical: "6–10", why: "Прочнее металл — зазор чуть больше"}
    min_hole_d_over_s:  {value: 1.2, unit: "× S", typical: "1,2–1,5", why: "Прочнее металл — пуансон нагружен сильнее"}
    min_bend_r_over_s:  {value: 1.5, unit: "× S", typical: "1,0–2,0", why: "Хуже гнётся, чем мягкая сталь"}
  stainless:
    title: "Нержавеющая сталь: 12Х18Н10Т, 08Х18Н10"
    sigma_b_mpa:        {value: 700, unit: "МПа", typical: "520–750", why: "Нержавейка прочная и сильно упрочняется"}
    clearance_pct:      {value: 9.0, unit: "% S на сторону", typical: "7–12", why: "Налипает на пуансон — зазор больше"}
    min_hole_d_over_s:  {value: 1.5, unit: "× S", typical: "1,5–2,0", why: "Высокое усилие на тонкий пуансон"}
    min_bend_r_over_s:  {value: 1.0, unit: "× S", typical: "0,5–2,0", why: "Сильное пружинение — угол доводят калибровкой"}
  aluminium:
    title: "Алюминий мягкий: АД0, АД1, АМц, АМг2 (отожжённые)"
    sigma_b_mpa:        {value: 240, unit: "МПа", typical: "70–240", why: "Мягкий металл — усилия малые"}
    clearance_pct:      {value: 5.0, unit: "% S на сторону", typical: "4–7", why: "Мягкий металл — зазор меньше"}
    min_hole_d_over_s:  {value: 1.0, unit: "× S", typical: "0,8–1,0", why: "Как у мягкой стали"}
    min_bend_r_over_s:  {value: 1.0, unit: "× S", typical: "0,5–1,5", why: "Для твёрдых состояний (Н, Т) — больше"}
  brass:
    title: "Латунь мягкая: Л63, Л68"
    sigma_b_mpa:        {value: 400, unit: "МПа", typical: "300–400", why: "—"}
    clearance_pct:      {value: 5.0, unit: "% S на сторону", typical: "4–7", why: "—"}
    min_hole_d_over_s:  {value: 1.0, unit: "× S", typical: "1,0", why: "—"}
    min_bend_r_over_s:  {value: 1.0, unit: "× S", typical: "0,5–1,0", why: "—"}

cutting:
  tau_over_sigma_b:          {title: "Сопротивление срезу τ / σв", value: 0.8,  unit: "",      typical: "0,7–0,85", why: "Сопротивление срезу τ = 0,8·σв"}
  k_force:                   {title: "Коэффициент запаса к усилию резки", value: 1.2,  unit: "",      typical: "1,1–1,3",  why: "Запас на затупление кромок, разброс толщины и зазора"}
  k_strip:                   {title: "Усилие съёма, доля от резки", value: 0.05, unit: "",      typical: "0,02–0,10", why: "Усилие снятия металла с пуансона (съём), доля от усилия резки"}
  k_push:                    {title: "Проталкивание через поясок, доля на 1 отход", value: 0.05, unit: "",      typical: "0,05–0,10", why: "Проталкивание отхода через поясок матрицы, на каждую застрявшую штуку"}
  land_height_min_mm:        {title: "Поясок матрицы, не меньше", value: 4.0,  unit: "мм",    typical: "3–8",      why: "Высота прямого рабочего пояска матрицы (дальше — расширение на провал)"}
  land_height_over_s:        {title: "Поясок матрицы, не меньше k·S", value: 2.0,  unit: "× S",   typical: "1,5–3",    why: "Поясок не меньше 2·S"}

geometry_rules:
  hole_edge_min_over_s:      {title: "От отверстия до края детали", value: 1.0, unit: "× S", typical: "1,0–1,5", why: "Перемычка от отверстия до края детали. Тоньше — рвётся и коробится"}
  hole_hole_min_over_s:      {title: "Между отверстиями", value: 1.0, unit: "× S", typical: "1,0–1,5", why: "Перемычка между отверстиями"}
  hole_bend_min_over_s:      {title: "От отверстия до начала гиба", value: 2.0, unit: "× S", typical: "1,5–2,5", why: "От края отверстия до начала гиба. Ближе — отверстие вытянется: пробивать ПОСЛЕ гибки"}
  flange_straight_min_over_s: {title: "Прямой участок полки", value: 2.0, unit: "× S", typical: "2–3",    why: "Прямой участок полки после радиуса. Короче — полка не гнётся в штампе ровно"}
  joggle_max_gap_over_s:     {title: "Встречные гибы ближе — это подсечка", value: 5.0, unit: "× S", typical: "3–6",     why: "Два встречных гиба ближе этого — это подсечка (ступенька), делается за один ход"}

bending:
  # Коэффициент x положения нейтрального слоя (то же, что K-фактор).
  # Классическая справочная таблица по r/S. ОБЯЗАТЕЛЬНО уточнить пробным гибом.
  x_table:
    title: "Нейтральный слой x (K-фактор) по r/S"
    value: [[0.1, 0.21], [0.2, 0.22], [0.3, 0.23], [0.4, 0.24], [0.5, 0.25], [0.6, 0.26], [0.7, 0.28],
            [0.8, 0.30], [1.0, 0.32], [1.2, 0.33], [1.5, 0.36], [2.0, 0.37], [2.5, 0.40], [3.0, 0.41],
            [4.0, 0.44], [5.0, 0.45], [6.0, 0.46], [7.0, 0.48], [8.0, 0.50]]
    unit: "x по r/S"
    typical: "справочная таблица"
    why: "Где в толще листа нейтральный слой. От него длина развёртки. Проверить пробным гибом на вашем металле и прессе"
  v_opening_over_s:          {title: "Ширина V-ручья для расчёта", value: 8.0,  unit: "× S", typical: "6–12",   why: "Ширина V-ручья матрицы для расчёта усилия свободной гибки"}
  k_air:                     {title: "Коэффициент свободной гибки", value: 1.33, unit: "",    typical: "1,2–1,33", why: "Коэффициент в формуле усилия свободной гибки F = k·σв·L·S²/V"}
  u_factor:                  {title: "U-гибка относительно V-гибки", value: 2.0,  unit: "",    typical: "≈2",     why: "U-гибка (две полки за ход) ≈ вдвое больше, чем V-гибка той же длины"}
  bottoming_factor:          {title: "Гибка с дожимом / свободная", value: 4.0,  unit: "",    typical: "3–5",    why: "Гибка с дожимом (калибровкой) для точного угла — в разы больше свободной"}
  pad_factor:                {title: "Прижим/выталкиватель, доля", value: 0.3,  unit: "",    typical: "0,25–0,30", why: "Прижим/выталкиватель: добавка к усилию гибки"}

press:
  force_margin:              {title: "Предельная загрузка пресса", value: 0.8, unit: "",   typical: "0,7–0,8", why: "Нагружаем пресс не больше 80% номинала"}
  shut_height_margin_mm:     {title: "Запас по закрытой высоте", value: 5.0, unit: "мм", typical: "5–10",    why: "Запас от крайних положений регулировки закрытой высоты"}
  table_clamp_margin_mm:     {title: "Место под прихваты на столе", value: 40.0, unit: "мм", typical: "30–60",  why: "Место под прихваты по краям нижней плиты штампа"}
  cop_offset_warn_mm:        {title: "Смещение центра давления, предупреждать от", value: 10.0, unit: "мм", typical: "5–15",   why: "Центр давления далеко от оси хвостовика — перекос ползуна, износ направляющих"}

tooling:
  punch_compressive_allow_mpa: {title: "Допустимое сжатие пуансона", value: 1500, unit: "МПа", typical: "1200–2000", why: "Допустимое сжатие закалённого пуансона (Х12МФ, HRC 58–62). Проверка тонких пуансонов"}
  heat_treat_required_series:  {title: "Закалка рабочих деталей обязательна от серии", value: 1000, unit: "шт",  typical: "500–2000", why: "Больше этой серии рабочие детали штампа только закалённые"}

shop:
  guillotine_tol_mm:         {title: "Точность резки на гильотине", value: 0.3, unit: "мм", typical: "0,2–0,5", why: "Точность резки на гильотине: влияет на высоту полок, если заготовку режут на гильотине"}

progressive:
  bridge_over_s:             {title: "Перемычка между деталями в полосе", value: 1.5,  unit: "× S", typical: "1,0–2,0", why: "Перемычка между деталями в полосе"}
  side_web_over_s:           {title: "Боковая перемычка полосы", value: 1.5,  unit: "× S", typical: "1,0–2,0", why: "Боковая перемычка полосы"}
  idle_stations:             {title: "Пустые позиции", value: 1,    unit: "шт",  typical: "0–2",     why: "Пустые позиции, чтобы стенки матрицы не были тонкими"}
  max_blank_mm_first:        {title: "Первый прогрессивный — деталь не больше", value: 120,  unit: "мм",  typical: "—",       why: "Первый прогрессивный штамп — только для деталей не больше этого размера"}
  min_series_per_year:       {title: "Прогрессивный окупается от серии", value: 20000, unit: "шт/год", typical: "10 000–50 000", why: "Меньше — прогрессивный штамп обычно не окупается"}
